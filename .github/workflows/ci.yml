name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QUICHE compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libicu-dev libssl-dev python3-venv

      - name: Configure C++ core (fetches pinned Dear ImGui)
        run: cmake -B build -DIMGUI_QUIC_BUILD_EXAMPLES=ON -DIMGUI_QUIC_BUILD_TESTS=ON -DIMGUI_QUIC_BUILD_BENCHMARKS=ON

      - name: Build C++ core and example
        run: cmake --build build --parallel

      - name: Run C++ core tests
        run: ctest --test-dir build --output-on-failure

      - name: Run draw transport and frontend regressions
        run: |
          node tests/browser/draw_ip.mjs
          node tests/browser/compressed_draw.mjs
          node tests/browser/planar_draw.mjs
          node tests/browser/quantized_draw.mjs
          node tests/browser/webtransport.mjs
          node tests/browser/dev_server.mjs
          node tests/browser/clipboard_shortcuts.mjs
          node tests/browser/large_clipboard_batch.mjs
          node tests/browser/media_viewer.mjs
          node tests/browser/benchmark.mjs
          node tests/browser/benchmark_cli.mjs
          python3 tests/browser/benchmark_clock.py build/transport_benchmark_host

      - name: Install real Chromium for browser acceptance
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          npm install --prefix build/browser --save-exact playwright@1.62.1
          node build/browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: Allow only the installed Chromium executables to use their sandbox
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/imgui-benchmark-chromium"
          from pathlib import Path
          root = Path.home() / '.cache/ms-playwright'
          binaries = sorted(p.resolve() for p in root.rglob('*')
                            if p.is_file() and p.name in ('chrome', 'chrome-headless-shell'))
          if not binaries:
              raise SystemExit('Chromium executables not found')
          print('abi <abi/4.0>,\ninclude <tunables/global>')
          for i, binary in enumerate(binaries):
              print(f'profile imgui-benchmark-chromium-{i} "{binary}" flags=(unconfined) {{\n  userns,\n}}')
          PY
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/imgui-benchmark-chromium" /etc/apparmor.d/imgui-benchmark-chromium
          sudo apparmor_parser -r /etc/apparmor.d/imgui-benchmark-chromium

      - name: Run real Chromium WebTransport and WebGL acceptance
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/benchmarks/browser/ci
          {
            uname -a
            cat /etc/os-release
            lscpu
            cmake --version
            clang --version
            node --version
            git rev-parse HEAD
          } > build/benchmarks/browser/ci/environment.txt
          status=0
          for scene in moving dynamic; do
            node tools/benchmarks/browser/run.mjs --scene "$scene" --seconds 5 --trials 1 \
              --output "build/benchmarks/browser/ci/$scene.json" \
              2>&1 | tee "build/benchmarks/browser/ci/$scene.log" || status=1
          done
          node - <<'JS'
          const fs=require('node:fs');
          for(const scene of ['moving','dynamic']) {
            const report=JSON.parse(fs.readFileSync(`build/benchmarks/browser/ci/${scene}.json`));
            if(report.status!=='PASS' || report.trials.length!==1 || report.trials[0].frames<120)
              throw Error(`${scene}: real-browser acceptance did not pass`);
          }
          JS
          exit "$status"

      - name: Preserve browser acceptance JSON and environment
        if: always() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-acceptance-${{ github.sha }}
          path: build/benchmarks/browser/ci/
          if-no-files-found: warn

      - name: Test native WebTransport
        run: |
          python3 -m venv build/webtransport_venv
          build/webtransport_venv/bin/pip install -r tests/webtransport/requirements.txt
          ./build/examples/imgui_quic_dev --prepare-only
          build/webtransport_venv/bin/python tests/webtransport/test_native.py
          IMGUI_QUIC_TEST_LZ4=0 build/webtransport_venv/bin/python tests/webtransport/test_native.py
          IMGUI_QUIC_TEST_QUANTIZED=1 build/webtransport_venv/bin/python tests/webtransport/test_native.py
          IMGUI_QUIC_TEST_PRECISION=integer build/webtransport_venv/bin/python tests/webtransport/test_native.py

      - name: Check frontend JavaScript
        run: |
          node --check frontend/imgui_quic_draw.js
          node --check frontend/imgui_quic_transport.js
          node --check frontend/imgui_quic.js

      - name: Check generator sources
        run: |
          python3 -m py_compile tools/dear_bindings/generate.py

      - name: Check whitespace
        run: git diff --check

  vcpkg-port:
    runs-on: ubuntu-latest
    # Cold Debug and Release builds each compile the QUICHE dependency.
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check offline vcpkg dependency contract
        run: cmake -DWORK="$RUNNER_TEMP/vcpkg-port-contract" -P tests/vcpkg_port.cmake

      - name: Install QUICHE compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libicu-dev libssl-dev python3-venv

      # Builds the port from the checkout (IMGUI_QUIC_LOCAL_SOURCE_DIR, the
      # portfile's pre-release validation branch) and consumes it through a
      # fresh manifest project, the way end users do.
      - name: Exercise the vcpkg port with a manifest consumer
        env:
          IMGUI_QUIC_LOCAL_SOURCE_DIR: ${{ github.workspace }}
        run: |
          set -eux
          D="$RUNNER_TEMP/port-consumer"
          mkdir -p "$D"
          cat > "$D/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(imgui_quic_port_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(imgui_quic CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE imgui_quic::core)
          EOF
          cat > "$D/vcpkg.json" <<'EOF'
          {
            "name": "imgui-quic-port-consumer",
            "version": "0.0.0",
            "dependencies": [ "imgui-quic" ]
          }
          EOF
          cat > "$D/vcpkg-configuration.json" <<EOF
          {
            "overlay-ports": [ "${{ github.workspace }}/ports" ]
          }
          EOF
          cat > "$D/main.cpp" <<'EOF'
          #include <chrono>
          #include <cstdio>
          #include <thread>

          #include "imgui.h"
          #include "imgui_quic.hpp"

          int main() {
              imgui_quic::Config config;
              imgui_quic::Server app;
              if (!app.init(config)) {
                  return 1;
              }
              bool running = true;
              auto render = app.on_render([&]() {
                  ImGui::Begin("port consumer", &running);
                  ImGui::TextUnformatted("installed via vcpkg");
                  ImGui::End();
              });
              for (int i = 0; running && render && i < 10; ++i) {
                  app.render();
                  std::this_thread::sleep_for(std::chrono::milliseconds(16));
              }
              std::puts("vcpkg port consumer ok");
              return 0;
          }
          EOF
          cmake -S "$D" -B "$D/build" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build "$D/build"
          "$D/build/consumer"
